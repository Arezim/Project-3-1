# Publish joint_states
joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50
arm_controller:
    type: position_controllers/JointTrajectoryController
    joints:
      - m_robot_joint_1
      - m_robot_joint_2
      - m_robot_joint_3
      - m_robot_joint_4
      - m_robot_joint_5
      - m_robot_joint_6
      - m_robot_joint_7