controller_list:
  - name: fake_/gripper_controller
    type: $(arg fake_execution_type)
    joints:
      - rg6_joint_1_1
      - rg6_joint_1_2
      - rg6_joint_2_1
      - rg6_joint_2_2
  - name: fake_/arm_controller
    type: $(arg fake_execution_type)
    joints:
      - iiwa_joint_1
      - iiwa_joint_2
      - iiwa_joint_3
      - iiwa_joint_4
      - iiwa_joint_5
      - iiwa_joint_6
      - iiwa_joint_7
initial:  # Define initial robot poses per group
  - group: /gripper
    pose: default_pose_gripper
  - group: /arm
    pose: pose1